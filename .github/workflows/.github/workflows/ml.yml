%%writefile .github/workflows/ml.yml

name: MLOps-Customer-Churn

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate project
        run: |
          test -f customers.csv
          test -f train.py
          test -f validation.py

      - name: Run unit tests
        run: python -m pytest -v

      - name: Train model and enforce quality gate
        run: python train.py --check-quality-gate

        - name: Upload MLflow logs and model artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlops-training-results
          path: |
            mlruns/
            artifacts/
          if-no-files-found: warn
          retention-days: 14
