
name: Customer Churn MLOps Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test-and-train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dvc

      - name: Check DVC metadata
        run: dvc status

      - name: Generate dataset if not available
        run: |
          if [ ! -f data/customers.csv ]; then
            python generate_data.py
          fi

      - name: Validate data and run tests
        run: python -m pytest -v

      - name: Train model and enforce quality gate
        run: python train.py --check-quality-gate
